<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.22"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .key { fill: #67e8f9; font-weight: 700; }
      .value { fill: #e5e7eb; }
      .muted { fill: #94a3b8; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <g filter="url(#shadow)">
    <rect x="25" y="25" width="850" height="650" rx="18"
          fill="url(#panel)" stroke="#263244" stroke-width="2"/>

    <!-- terminal title bar -->
    <circle cx="55" cy="58" r="7" fill="#ef4444"/>
    <circle cx="78" cy="58" r="7" fill="#f59e0b"/>
    <circle cx="101" cy="58" r="7" fill="#22c55e"/>

    <text x="128" y="64" class="mono muted" font-size="18">
      naichal@github: ~
    </text>

    <line x1="45" y1="92" x2="855" y2="92" stroke="#263244"/>

    <!-- prompt -->
    <text x="55" y="135" class="mono" font-size="20">
      <tspan fill="#67e8f9">naichal</tspan>
      <tspan fill="#94a3b8">@github</tspan>
      <tspan fill="#e5e7eb"> ~ $ </tspan>
      <tspan fill="#f8fafc">whoami</tspan>
    </text>

    <!-- heading -->
    <text x="55" y="185" class="mono" fill="#f8fafc" font-size="34" font-weight="700">
      naichal18
    </text>
    <text x="55" y="215" class="mono muted" font-size="17">
      backend • python • learning by building
    </text>

    <!-- divider -->
    <line x1="55" y1="245" x2="845" y2="245" stroke="#263244"/>

    <!-- rows -->

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s"
               begin="0.35s" fill="freeze"/>
      <text x="65" y="295" class="mono key" font-size="19">role:</text>
      <text x="220" y="295" class="mono value" font-size="19">Backend Developer</text>
      <line x1="65" y1="313" x2="835" y2="313" stroke="#1f2937"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s"
               begin="0.53s" fill="freeze"/>
      <text x="65" y="359" class="mono key" font-size="19">focus:</text>
      <text x="220" y="359" class="mono value" font-size="19">Python &amp; Backend</text>
      <line x1="65" y1="377" x2="835" y2="377" stroke="#1f2937"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s"
               begin="0.71s" fill="freeze"/>
      <text x="65" y="423" class="mono key" font-size="19">learning:</text>
      <text x="220" y="423" class="mono value" font-size="19">JavaScript Basics</text>
      <line x1="65" y1="441" x2="835" y2="441" stroke="#1f2937"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s"
               begin="0.89s" fill="freeze"/>
      <text x="65" y="487" class="mono key" font-size="19">build:</text>
      <text x="220" y="487" class="mono value" font-size="19">Small Web Projects</text>
      <line x1="65" y1="505" x2="835" y2="505" stroke="#1f2937"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.45s"
               begin="1.07s" fill="freeze"/>
      <text x="65" y="551" class="mono key" font-size="19">mindset:</text>
      <text x="220" y="551" class="mono value" font-size="19">Break It • Understand It</text>
      <line x1="65" y1="569" x2="835" y2="569" stroke="#1f2937"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s"
               begin="1.35s" fill="freeze"/>
      <text x="55" y="625" class="mono muted" font-size="16">
        $ echo "I prefer breaking things to understand how they work."
      </text>
    </g>

    <text x="55" y="653" class="mono" font-size="15">
      <tspan fill="#67e8f9">status:</tspan>
      <tspan fill="#94a3b8"> learning • building • experimenting</tspan>
    </text>
  </g>
</svg>
